name: Build and Release TorrentApp

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Restore Dependencies
        run: dotnet restore TorrentApp.csproj

      - name: Publish WinUI 3 App (Unpackaged)
        shell: powershell
        run: |
          Remove-Item -Path "bin\Release" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "output" -Recurse -Force -ErrorAction SilentlyContinue
          dotnet publish TorrentApp.csproj -c Release -r win-x64 --self-contained false -p:WindowsPackageType=None
          Remove-Item -Path "bin\Release\net10.0-windows10.0.26100.0\win-x64\*.pdb" -Force -ErrorAction SilentlyContinue

      - name: Compile Inno Setup Installer (.exe)
        run: |
          iscc installer.iss

      - name: Create Portable Zip Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "output" -ErrorAction SilentlyContinue
          Compress-Archive -Path "bin\Release\net10.0-windows10.0.26100.0\win-x64\*" -DestinationPath "output\TorrentApp-portable-x64.zip"

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || (inputs.version != '' && inputs.version || 'v1.0.0') }}
          name: TorrentApp Release ${{ github.ref_type == 'tag' && github.ref_name || (inputs.version != '' && inputs.version || 'v1.0.0') }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            output/setup-apptorrent-x64.exe
            output/TorrentApp-portable-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
